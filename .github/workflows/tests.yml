name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No ROM in CI: ROM-dependent tests skip. Torch is skipped until a test needs it.
      - run: grep -v '^torch' requirements.txt | sed 's/^opencv-python==/opencv-python-headless==/' > ci-requirements.txt
      - run: pip install -r ci-requirements.txt
      - run: python -m pytest -q -rs
